<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f2">
    <title>{% block title %}Syllable Shaker{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --ink: #202c28;
            --muted: #68756e;
            --accent: #256c50;
            --border: #e1e6df;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            color: var(--ink);
            background: radial-gradient(ellipse at 50% 0%, #e7eee3 0%, transparent 65%), #f5f6f2;
            font-family: "Rubik", sans-serif;
            line-height: 1.5;
        }

        #container {
            width: min(100% - 48px, 960px);
            min-height: 100vh;
            min-height: 100svh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .site-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 32px 0;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }

        main {
            flex: 1;
            display: grid;
            align-content: center;
            padding: 32px 0 64px;
        }

        .panel {
            width: min(100%, 520px);
            margin: 0 auto;
            padding: 40px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 12px 48px -24px #263d3333;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        h1, h2, p { margin-top: 0; }
        h1 { margin-bottom: 12px; font-size: clamp(28px, 5vw, 36px); font-weight: 500; letter-spacing: -1.4px; line-height: 1.2; }
        .subtitle { margin-bottom: 32px; color: var(--muted); font-size: 14px; }
        .field { margin-bottom: 22px; }
        .field-label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 500; }

        input[type="text"], input[type="number"] {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid #cbd4cc;
            border-radius: 10px;
            background: #fbfcfa;
            color: var(--ink);
            font: inherit;
            font-size: 15px;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        input[type="text"] { font-family: ui-monospace, monospace; }
        .input-with-unit { position: relative; }
        .input-with-unit input { padding-right: 88px; }
        .input-unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; pointer-events: none; }

        .options { margin: 6px 0 28px; border-top: 1px solid var(--border); }
        .option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            font-size: 14px;
        }
        input[type="checkbox"] { width: 19px; height: 19px; margin: 0; accent-color: var(--accent); cursor: pointer; }

        button, input[type="submit"] {
            min-height: 48px;
            padding: 12px 20px;
            border: 1px solid transparent;
            border-radius: 12px;
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 150ms ease, border-color 150ms ease;
        }
        #button, .button-success { background: var(--accent); color: #fff; }
        #button:hover, .button-success:hover { background: #1b533d; }
        .primary-action { width: 100%; }
        :focus-visible { outline: 3px solid #79a98c; outline-offset: 4px; }
        input[type="text"]:focus, input[type="number"]:focus { border-color: var(--accent); }

        .word-panel { width: min(100%, 760px); text-align: center; padding: 48px 40px 32px; }
        .word-stage { min-height: 180px; display: grid; place-items: center; padding: 24px 0 40px; }
        #myWord { margin: 0; font-size: clamp(32px, 7vw, 72px); font-weight: 500; letter-spacing: -2px; overflow-wrap: anywhere; max-width: 100%; }
        .word-actions { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
        .word-actions form { margin: 0; }
        .word-actions button { width: 100%; }
        .button-failure { background: #fcf0ed; border-color: #f0d9d3; color: #a34435; }
        .button-failure:hover { background: #f8e2dc; border-color: #e5b9ad; }
        .score-label { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px; }
        .score h2 { margin: 3px 0 0; font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
        .action-symbol { margin-right: 8px; }
        .error-panel #myWord { margin-bottom: 28px; font-size: 22px; letter-spacing: -0.5px; }

        #footer { display: flex; justify-content: space-between; gap: 16px; padding: 24px 0; border-top: 1px solid #dce3da; color: var(--muted); font-size: 12px; }
        #footer a { color: var(--ink); text-decoration-color: #a7b5ab; text-underline-offset: 4px; }
        #footer a:hover { color: var(--accent); }

        @media (max-width: 540px) {
            #container { width: calc(100% - 32px); }
            .site-header { padding: 24px 0; }
            main { padding: 16px 0 40px; }
            .panel { padding: 28px 24px; border-radius: 20px; }
            .word-panel { padding: 32px 20px 24px; }
            .word-actions { gap: 12px; }
            .word-actions button { padding: 12px 8px; }
            .action-symbol { display: block; margin: 0; }
            .word-stage { min-height: 160px; }
        }

        @media (prefers-reduced-motion: reduce) {
            input, button { transition: none !important; }
        }
    </style>
    {% block scripts %}{% endblock %}
</head>
<body>
    <div id="container">
        <header class="site-header">
            <span class="brand-mark" aria-hidden="true">s.</span>
            <span>Syllable Shaker</span>
        </header>
        <main>{% block content %}{% endblock %}</main>
        <footer id="footer">
            <span>author: sjp</span>
            <span>source: <a href="https://github.com/basegpu/random-word-generator.git">github</a></span>
        </footer>
    </div>
</body>
</html>

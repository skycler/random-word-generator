<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f2">
    <title>{% block title %}Syllable Shaker{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    {% block scripts %}{% endblock %}
</head>
<body>
    <div id="container">
        <header class="site-header">
            <a class="brand-link" href="{{ url_for('index', configuration_token=configuration.to_token()) if configuration is defined else url_for('index') }}" aria-label="Syllable Shaker home">
                <span class="brand-mark" aria-hidden="true">s.</span>
                <span>Syllable Shaker</span>
            </a>
        </header>
        <main>{% block content %}{% endblock %}</main>
        <footer id="footer">
            <span>author: sjp</span>
            <span>source: <a href="https://github.com/basegpu/random-word-generator.git">github</a></span>
        </footer>
    </div>
</body>
</html>

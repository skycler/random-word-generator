{% extends "layout.html" %}

{% block scripts %}
<script src="https://code.jquery.com/jquery-3.5.0.js"></script>
<script>
    var fade_out = function() {
        $("#myWord").fadeOut().empty();
    }
    if ({{ templateFadeout }} > 0) {
        setTimeout(fade_out, {{ templateFadeout }});
    }
</script>
{% endblock %}

{% block content %}
<section class="panel word-panel" aria-label="Generated word">
    <p class="eyebrow">Your next word</p>
    <div class="word-stage">
        <h1 id="myWord">{{ word }}</h1>
    </div>
    <div class="word-actions">
        <form action="{{ url_for('same_word', code=templateCode, config=templateConfig, score=templateScore, fadeout=templateFadeout, capitalize=templateCapitalize) }}">
            <button class="button-failure"><span class="action-symbol" aria-hidden="true">×</span>Try again</button>
        </form>
        <div class="score">
            <span class="score-label">Score</span>
            <h2>{{ templateScore }}</h2>
        </div>
        <form action="{{ url_for('next_word', config=templateConfig, score=templateScore, fadeout=templateFadeout, capitalize=templateCapitalize) }}">
            <button class="button-success">Next word<span aria-hidden="true"> &rarr;</span></button>
        </form>
    </div>
</section>
{% endblock %}

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python and JavaScript tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          enable-cache: true
          cache-python: true

      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check lint and formatting
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Run Python tests with coverage
        run: uv run --locked pytest --cov=syllable_shaker --cov-report=term-missing --cov-report=xml -q

      - name: Run JavaScript timer tests
        run: node --test tests/*.test.cjs

      - name: Build distributions
        run: uv build

  container:
    name: Production container
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --tag syllable-shaker:ci .

      - name: Smoke-test non-root runtime and packaged assets
        run: |
          docker run --detach --name syllable-shaker-ci \
            --publish 127.0.0.1:8000:8000 --env PORT=8000 syllable-shaker:ci
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-connrefused \
            --retry-delay 1 --max-time 5 http://127.0.0.1:8000/ > /dev/null
          for path in /static/app.css /static/word.js /word/v2.WyJuYWxpbW8iLDMsMCwwLDAsMjUwLDFd; do
            curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:8000$path" > /dev/null
          done
          test "$(docker exec syllable-shaker-ci id -u)" != "0"

      - name: Show logs and clean up
        if: always()
        run: |
          docker logs syllable-shaker-ci || true
          docker rm --force syllable-shaker-ci || true

[project]
name = "syllable-shaker"
version = "0.1.0"
description = "German-readable invented words with stateless, obfuscated navigation"
readme = "README.md"
requires-python = ">=3.14"
license-files = ["LICENSE"]
dependencies = [
    "flask>=3.1.3,<4",
    "gunicorn>=27.0.1,<28",
    "qrcode[pil]>=8.2,<9",
]

[project.urls]
Source = "https://github.com/skycler/random-word-generator"
Issues = "https://github.com/skycler/random-word-generator/issues"

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17.5,<1",
]

[build-system]
requires = ["uv_build==0.13.8"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.8"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.build-backend]
source-include = ["tests/**", ".python-version", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]

[tool.coverage.run]
source = ["syllable_shaker"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
